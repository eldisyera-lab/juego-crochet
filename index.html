<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crochet para Aprender – Juego</title>
<style>
:root{--bg:#f7efe2;--card:#fffaf2;--tx:#3b2a1a;--mu:#7a6650;--ac:#8a5a1f;--ac2:#d49a2a;--ok:#2e8a5a;--ko:#c0432f;--bd:#e6d5bb;--pl:#4f2a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--card:#2a2219;--tx:#f5ead8;--mu:#c9b79b;--ac:#b8741a;--ac2:#e0a43a;--ok:#4fcf93;--ko:#ff8a7a;--bd:#43372a;--pl:#e2c3e8;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.45}
#app{max-width:640px;margin:0 auto;padding:16px}
h1,h2{font-family:Georgia,'Times New Roman',serif}h1{font-size:1.7rem;margin:.3em 0;color:var(--pl)}h2{font-size:1.3rem;margin:.3em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin:12px 0}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem;text-align:left;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;text-align:center;font-weight:700}
.btn:disabled{opacity:.5}
.btn.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.btn.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 18%,var(--card))}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem;margin-bottom:6px}
.lv{display:flex;align-items:center;gap:12px}.lv .ic{font-size:2rem}.lv small{color:var(--mu)}
.fb{padding:12px;border-radius:12px;margin-top:10px;background:var(--bg);border:1px solid var(--bd)}
.c{text-align:center}.lg{width:110px;height:110px;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.2)}.big{font-size:3rem}
input{width:100%;padding:12px;font-size:1rem;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx)}
.dip{border:4px double var(--ac);text-align:center;padding:22px}
</style></head><body><div id="app"></div>

const TF=['Verdadero','Falso'];
const L=[
{n:'Materiales y bases',i:'🧶',b:'Aprendiz del Ovillo',q:[
['m','¿Qué gancho conviene usar con un hilo muy grueso?',['Uno más grande','Uno muy pequeño','Da igual'],0,'Cuanto más grueso el hilo, más grande debe ser el gancho para que el tejido quede flexible.'],
['t','Un gancho más pequeño hace un tejido más apretado.',TF,0,'El tamaño del gancho cambia el tamaño de cada lazada: menor gancho, puntos más ajustados.'],
['m','Un gancho de “4 mm” indica…',['Su largo','El grosor (diámetro) del cuerpo','Su peso'],1,'La numeración en mm indica el diámetro del vástago, que define el tamaño del punto.'],
['m','¿Qué hilo es más fácil para empezar?',['Peludo y negro','Liso, de grosor medio y color claro','Muy fino y brillante'],1,'Con hilo liso y claro se ven bien los puntos y es más fácil corregir.'],
['t','Hay que apretar el gancho con mucha fuerza para tejer mejor.',TF,1,'Sujetarlo con fuerza cansa la mano. Hay que agarrarlo con suavidad y relajar hombros y muñecas.'],
['m','¿Qué es buena postura al tejer?',['Hombros encogidos','Espalda apoyada, hombros relajados y pausas cada cierto tiempo','Brazos sin apoyo durante horas'],1,'Descansar y estirar evita dolor de manos, cuello y espalda.']]},
{n:'Puntos básicos',i:'🪡',b:'Maestra del Punto',q:[
['m','¿Con qué se empieza casi todo tejido?',['Punto alto','Nudo corredizo','Punto raso'],1,'El nudo corredizo es la primera lazada que se coloca en el gancho.'],
['m','¿Cuál es el punto más corto de todos?',['Punto raso','Punto alto doble','Punto alto'],0,'El punto raso es el más bajo y casi no añade altura.'],
['m','Antes de insertar el gancho en un punto alto se hace…',['Nada','Una hilada (lazada sobre el gancho)','Dos hiladas'],1,'El punto alto empieza con una hilada; el punto alto doble, con dos.'],
['t','La cadeneta es la base de la mayoría de los proyectos.',TF,0,'Muchas piezas planas empiezan con una cadena de base.'],
['m','Al terminar un punto medio alto, antes de cerrar hay en el gancho…',['2 lazadas','3 lazadas','4 lazadas'],1,'Se cierran las 3 lazadas de una sola vez.'],
['m','¿Cuántas hiladas se hacen al inicio de un punto alto doble?',['1','2','Ninguna'],1,'Dos hiladas antes de insertar el gancho.']]},
{n:'Lectura de patrones',i:'📖',b:'Lectora de Patrones',q:[
['m','“pb” significa…',['Punto base','Punto bajo','Punto bordado'],1,'pb = punto bajo.'],
['m','“aum” en un patrón significa…',['Tejer 2 puntos en el mismo punto','Saltar un punto','Cambiar de color'],0,'Aumento: dos puntos en el mismo lugar.'],
['m','En “(pb, aum) x 3” hay que…',['Hacer lo del paréntesis 3 veces','Tejer 3 puntos totales','Hacer solo un aumento'],0,'El número tras la x indica cuántas veces se repite lo indicado.'],
['m','¿Por qué hay que confirmar si un patrón es US o UK?',['Por el color','Porque los mismos nombres designan puntos distintos','No importa'],1,'Por ejemplo, “dc” es punto alto en US y punto bajo en UK.'],
['m','“dism” significa…',['Unir dos puntos en uno','Añadir un punto','Cortar el hilo'],0,'Disminución: se juntan dos puntos y la vuelta pierde un punto.'],
['m','“cad 20” indica…',['20 puntos bajos','20 cadenetas','20 vueltas'],1,'Hay que hacer 20 cadenetas.']]},
{n:'Técnicas de forma',i:'⭕',b:'Forjadora de Formas',q:[
['m','El anillo mágico sirve para…',['Empezar piezas en redondo sin hueco central','Cambiar de color','Rematar'],0,'Permite cerrar el centro tirando del hilo.'],
['m','En un círculo plano estándar (6, 12, 18…), ¿cuántos puntos tiene la ronda 3?',['15','18','24'],1,'Cada ronda suma 6 puntos: 6, 12, 18.'],
['t','Al tejer en espiral no se cierra cada vuelta con punto raso.',TF,0,'En espiral se sigue sin cerrar; se usa un marcador para ubicar el inicio.'],
['m','La cadeneta de giro sirve para…',['Dar altura al empezar la vuelta','Decorar','Quitar puntos'],0,'Sube el hilo a la altura del punto de la vuelta siguiente.'],
['t','Si el borde de un círculo se ondula, probablemente hay demasiados aumentos.',TF,0,'Con exceso de aumentos, la pieza se ondula; con pocos, se curva como cuenco.'],
['m','Un marcador de puntos se usa para…',['Marcar el inicio de la vuelta','Medir el hilo','Cortar'],0,'Evita perder la cuenta en espiral.']]},
{n:'Acabados y soluciones',i:'✨',b:'Artesana Experta',q:[
['m','Para cambiar de color se hace…',['El cambio en la última lazada del último punto','Cortar y empezar sin nudo','Cambiarlo al inicio del punto'],0,'Así el cambio queda limpio y sin escalón.'],
['m','Para rematar un hilo se…',['Corta pegado al nudo','Pasa con aguja lanera entre varios puntos','Hace un nudo grande'],1,'Se esconde el hilo en varias direcciones para que no se suelte.'],
['t','Los bordes que se ensanchan suelen deberse a puntos de más.',TF,0,'Suele pasar por contar mal o por no usar el primer/último punto correcto.'],
['m','El bloqueo consiste en…',['Humedecer y dar forma para que asiente','Apretar mucho el tejido','Cortar los bordes'],0,'Se moja o vaporiza y se deja secar con la forma deseada.'],
['m','¿Cómo evitar puntos de más o de menos?',['Contar los puntos al final de cada vuelta','No mirar','Tejer más rápido'],0,'Contar da seguridad y permite corregir pronto.'],
['m','Para lograr tensión pareja…',['Mantener un ritmo constante al pasar el hilo','Tirar fuerte','Cambiar de gancho cada vuelta'],0,'Con la práctica y un agarre estable la tensión mejora.']]}
];

const A=document.getElementById('app');
let st=L.map(()=>-1),lv=0,qs=[],ix=0,sc=0,miss=[],rev=false;
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const stars=n=>n<0?'🔒':'⭐'.repeat(n)||'—';
function home(){
 const tot=st.reduce((a,b)=>a+Math.max(b,0),0);
 let h=`<div class="c"><img class="lg" src="${LOGO}" alt="Logo eldisyerar crochet"><h1>Crochet para Aprender</h1><p>Juego de conocimiento: 5 niveles, 6 preguntas cada uno. Necesitas 4 aciertos para pasar.</p></div><div class="bar"><i style="width:${tot/15*100}%"></i></div><div class="top"><span>Progreso</span><span>${tot}/15 ⭐</span></div>`;
 L.forEach((l,k)=>{const open=k==0||st[k-1]>0;
  h+=`<button class="btn" ${open?'':'disabled'} onclick="start(${k})"><div class="lv"><span class="ic">${l.i}</span><div><b>Nivel ${k+1}: ${l.n}</b><br><small>${st[k]>0?l.b+' · '+stars(st[k]):open?'Toca para jugar':'Bloqueado'}</small></div></div></button>`});
 if(st.every(s=>s>0))h+=`<button class="btn p" onclick="dip()">🎓 Ver mi diploma</button>`;
 A.innerHTML=h}
function start(k,r){lv=k;rev=!!r;qs=r?sh(miss):sh(L[k].q);if(!r)miss=[];ix=0;sc=0;ask()}
function ask(){
 const q=qs[ix],ord=sh(q[2].map((t,i)=>i));
 A.innerHTML=`<div class="top"><span>${L[lv].i} Nivel ${lv+1}${rev?' · Repaso':''}</span><span>${ix+1}/${qs.length} · ✅ ${sc}</span></div><div class="bar"><i style="width:${ix/qs.length*100}%"></i></div><div class="card"><b>${q[0]=='t'?'Verdadero o falso: ':''}</b>${q[1]}</div><div id="o">${(q[0]=='t'?[0,1]:ord).map(i=>`<button class="btn" onclick="pick(this,${i})">${q[2][i]}</button>`).join('')}</div><div id="f"></div>`}
function pick(b,i){
 const q=qs[ix],ok=i==q[3];
 document.querySelectorAll('#o .btn').forEach(x=>{x.disabled=true;if(x.textContent==q[2][q[3]])x.classList.add('ok')});
 if(ok){sc++;}else{b.classList.add('ko');if(!miss.includes(q))miss.push(q)}
 document.getElementById('f').innerHTML=`<div class="fb">${ok?'🎉 ¡Muy bien! ':'💡 No pasa nada. '}${q[4]}</div><button class="btn p" onclick="nxt()">${ix+1<qs.length?'Siguiente':'Ver resultado'}</button>`}
function nxt(){ix++;ix<qs.length?ask():end()}
function end(){
 if(rev){home();return}
 const s=sc>=6?3:sc==5?2:sc==4?1:0,pass=s>0;
 if(pass&&s>st[lv])st[lv]=s;
 const lost=miss.length;
 A.innerHTML=`<div class="c card"><div class="big">${pass?'🏅':'🧵'}</div><h2>${pass?'¡Nivel superado!':'Casi lo logras'}</h2><p>${sc} de 6 aciertos · ${pass?stars(s):'Necesitas 4 para pasar'}</p>${pass?`<p>Insignia: <b>${L[lv].b}</b></p>`:''}</div>
 ${lost?`<button class="btn" onclick="start(lv,1)">🔁 Repasar las ${lost} que fallé</button>`:''}
 <button class="btn" onclick="start(lv)">🔄 Repetir el nivel</button>
 ${pass&&lv<4?`<button class="btn p" onclick="start(${lv+1})">Siguiente nivel ➜</button>`:''}
 <button class="btn" onclick="home()">🗺️ Mapa de niveles</button>`}
function dip(){
 A.innerHTML=`<div class="card dip"><img class="lg" src="${LOGO}" alt="Logo"><div class="big">🎓</div><h1>Tejedor/a Certificado/a</h1><p>Se otorga a</p><input id="nm" placeholder="Escribe tu nombre" oninput="document.getElementById('nn').textContent=this.value||'…'"><h2 id="nn">…</h2><p>por completar los 5 niveles de <b>Crochet para Aprender</b></p><p>Puntaje: ${st.reduce((a,b)=>a+b,0)}/15 ⭐</p></div><button class="btn p" onclick="pdf()">📄 Descargar certificado en PDF</button><button class="btn" onclick="home()">🗺️ Volver al mapa</button>`}
function mkpdf(j,w,h){
 const e=new TextEncoder(),P=[],o=[];let n=0;
 const add=x=>{const b=typeof x=='string'?e.encode(x):x;P.push(b);n+=b.length};
 add('%PDF-1.4\n');
 o[1]=n;add('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n');
 o[2]=n;add('2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n');
 o[3]=n;add('3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n');
 o[4]=n;add('4 0 obj<</Type/XObject/Subtype/Image/Width '+w+'/Height '+h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+j.length+'>>stream\n');add(j);add('\nendstream endobj\n');
 const cs='q 842 0 0 595 0 0 cm /Im0 Do Q';
 o[5]=n;add('5 0 obj<</Length '+cs.length+'>>stream\n'+cs+'\nendstream endobj\n');
 const x=n;add('xref\n0 6\n0000000000 65535 f \n');
 for(let i=1;i<6;i++)add(String(o[i]).padStart(10,'0')+' 00000 n \n');
 add('trailer<</Size 6/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF');
 return new Blob(P,{type:'application/pdf'})}
function pdf(){
 const nm=document.getElementById('nm'),name=nm.value.trim();
 if(!name){nm.focus();alert('Escribe tu nombre para el certificado 🧶');return}
 const W=1684,H=1190,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const im=new Image();
 im.onload=()=>{
  x.fillStyle='#fffaf2';x.fillRect(0,0,W,H);
  x.strokeStyle='#4f2a55';x.lineWidth=14;x.strokeRect(50,50,W-100,H-100);
  x.strokeStyle='#d49a2a';x.lineWidth=5;x.strokeRect(78,78,W-156,H-156);
  x.textAlign='center';x.fillStyle='#4f2a55';
  x.save();x.beginPath();x.arc(W/2,255,130,0,7);x.clip();x.drawImage(im,W/2-130,125,260,260);x.restore();
  x.font='bold 96px Georgia,serif';x.fillText('Tejedor/a Certificado/a',W/2,540);
  x.fillStyle='#7a6650';x.font='38px Georgia,serif';x.fillText('Se otorga a',W/2,615);
  let fs=110;x.fillStyle='#8a5a1f';
  do{x.font='italic bold '+fs+'px Georgia,serif';fs-=4}while(x.measureText(name).width>W-300&&fs>40);
  x.fillText(name,W/2,745);
  x.strokeStyle='#d49a2a';x.lineWidth=3;x.beginPath();x.moveTo(W/2-380,775);x.lineTo(W/2+380,775);x.stroke();
  x.fillStyle='#3b2a1a';x.font='40px Georgia,serif';
  x.fillText('por completar los 5 niveles del juego Crochet para Aprender',W/2,860);
  x.fillStyle='#7a6650';x.font='32px Georgia,serif';
  x.fillText('Insignias: '+L.map(l=>l.b).join(' · '),W/2,930);
  x.fillText('Puntaje: '+st.reduce((a,b)=>a+b,0)+'/15 estrellas',W/2,985);
  x.fillStyle='#4f2a55';x.font='bold 34px Georgia,serif';
  x.fillText('Crochet para Aprender · eldisyerar · '+new Date().toLocaleDateString('es'),W/2,1090);
  const d=atob(c.toDataURL('image/jpeg',0.92).split(',')[1]),u=new Uint8Array(d.length);
  for(let i=0;i<d.length;i++)u[i]=d.charCodeAt(i);
  const a=document.createElement('a');a.href=URL.createObjectURL(mkpdf(u,W,H));a.download='Certificado-Crochet-para-Aprender.pdf';
  document.body.appendChild(a);a.click();a.remove()};
 im.src=LOGO}
home();
</script></body></html>
